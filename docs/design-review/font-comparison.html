<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>伟大征程 · 字体构图评审（非首页）</title>
<style>
@font-face{font-family:ZhiProof;src:url(fonts/ZhiMangXing-Regular.ttf)}
@font-face{font-family:MaProof;src:url(fonts/MaShanZheng-Regular.ttf)}
@font-face{font-family:LiuProof;src:url(fonts/LiuJianMaoCao-Regular.ttf)}
*{box-sizing:border-box}body{margin:0;padding:24px;background:#100d0d;color:#f2ede5;font:16px/1.6 sans-serif}h1{font-size:24px}button,input{font:inherit}button{padding:8px 18px;margin-right:12px;background:#201718;color:#f2ede5;border:1px solid #806f63;cursor:pointer}button[aria-pressed=true]{background:#8f2635}button:focus-visible{outline:2px solid #f2ede5;outline-offset:3px}.tools{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.stage{position:relative;width:min(100%,1920px);aspect-ratio:16/9;overflow:hidden;container-type:inline-size;background:#201718}.stage img{position:absolute;width:100%;height:100%;object-fit:cover;object-position:45% 50%}.veil{position:absolute;inset:0;background:linear-gradient(90deg,transparent 44%,rgba(16,13,13,.72) 58%,rgba(16,13,13,.72) 94%,rgba(16,13,13,.4))}.title{position:absolute;left:58%;top:23%;margin:0;white-space:nowrap;font:400 8.125cqw/1.25 ZhiProof;letter-spacing:.3125cqw;color:#f2ede5}.year{position:absolute;left:58%;top:18%;color:#b99a61;font-size:1.67cqw}.note{position:absolute;left:58%;top:44%;font-size:1.25cqw;max-width:35%}.safe{position:absolute;left:58%;top:20%;width:36%;height:25%;border:1px dashed #b99a61;pointer-events:none}.palette{display:flex;gap:20px;flex-wrap:wrap;margin-top:20px}.swatch{display:inline-block;width:30px;height:30px;vertical-align:middle;border:1px solid #806f63}#status{color:#bdb3a7}body:not(.show-safe) .safe{display:none}
</style>
<h1>标题字体与原图构图评审</h1>
<p>只在本机读取原始图片，不生成合成图片、不上传、不实现导航或业务功能。上方虚线可标示候选文字安全区。</p>
<div class="tools"><button data-font="ZhiProof" aria-pressed="true">A 志莽行书</button><button data-font="MaProof" aria-pressed="false">B 马善政</button><button data-font="LiuProof" aria-pressed="false">C 流建毛草</button><label>字距 <input id="tracking" type="range" min="0" max="16" value="6"> <output id="trackValue">6px @1920</output></label><label><input id="safeToggle" type="checkbox">安全区</label></div>
<p id="status">等待实际字体文件加载……</p>
<div class="stage"><img src="../../pictures/山河壮阔的长征旗帜.png" alt="用户提供的长征主题艺术化场景，原件只读"><div class="veil"></div><div class="year">1936—2026</div><h2 class="title">伟大征程</h2><div class="note">纪念中国工农红军长征胜利九十周年</div><div class="safe"></div></div>
<div class="palette"><span><i class="swatch" style="background:#8f2635"></i> 原深红 #8F2635</span><span><i class="swatch" style="background:#8a2e22"></i> 暖红候选 #8A2E22</span><span><i class="swatch" style="background:#b99a61"></i> 暗金 #B99A61</span><span><i class="swatch" style="background:#100d0d"></i> 炭黑 #100D0D</span><span><i class="swatch" style="background:#f2ede5"></i> 米白 #F2EDE5</span></div>
<script>
const title=document.querySelector('.title'),status=document.querySelector('#status');
Promise.all(['ZhiProof','MaProof','LiuProof'].map(f=>document.fonts.load(`156px ${f}`,'伟大征程').then(faces=>{if(!faces.length)throw Error('字体未加载');}))).then(()=>status.textContent='三套实际字体加载完成；书法字重均为原生 400。网页抗锯齿可能与 PNG 字形图略有区别。').catch(()=>status.textContent='字体加载失败：当前不能据此确认字体效果，请检查本地字体路径。');
document.querySelectorAll('[data-font]').forEach(button=>button.addEventListener('click',()=>{title.style.fontFamily=button.dataset.font;document.querySelectorAll('[data-font]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));}));
document.querySelector('#tracking').addEventListener('input',event=>{title.style.letterSpacing=(Number(event.target.value)/19.2)+'cqw';document.querySelector('#trackValue').textContent=event.target.value+'px @1920';});
document.querySelector('#safeToggle').addEventListener('change',event=>document.body.classList.toggle('show-safe',event.target.checked));
</script></html>
